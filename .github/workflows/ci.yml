name: CI/CD - Build, Test & Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ────────────────────────────────────────────
  # JOB 1: Build & Test SERVER
  # ────────────────────────────────────────────
  build-server:
    name: 🖥️ Server – Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & run JUnit tests (server)
        working-directory: auction-server
        run: mvn clean verify --no-transfer-progress

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: auction-server/target/surefire-reports/

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: auction-server/target/*-shaded.jar

  # ────────────────────────────────────────────
  # JOB 2: Build CLIENT (compile only, no GUI)
  # ────────────────────────────────────────────
  build-client:
    name: 🎨 Client – Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile client (skip JavaFX run)
        working-directory: auction-client
        run: mvn clean compile --no-transfer-progress

  # ────────────────────────────────────────────
  # JOB 3: Summary (chỉ chạy khi cả 2 job pass)
  # ────────────────────────────────────────────
  ci-success:
    name: ✅ CI Passed
    runs-on: ubuntu-latest
    needs: [build-server, build-client]

    steps:
      - name: All checks passed
        run: echo "✅ Server build + tests và Client compile đều thành công!"