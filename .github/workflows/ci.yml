name: CI/CD - Build, Test & Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-server:
    name: 🖥️ Server – Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate config.properties from GitHub Secrets
        run: |
          cat > auction-server/src/main/resources/config.properties << EOF
          db.url=${{ secrets.DB_URL }}
          db.user=${{ secrets.DB_USER }}
          db.password=${{ secrets.DB_PASSWORD }}
          EOF

      - name: Build & run JUnit tests (server)
        working-directory: auction-server
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          echo "Java version:"
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          mvn clean verify --no-transfer-progress

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: auction-server/target/surefire-reports/

      - name: Upload server JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: auction-server/target/*-shaded.jar

  build-client:
    name: 🎨 Client – Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile client
        working-directory: auction-client
        run: mvn clean compile --no-transfer-progress

  ci-success:
    name: ✅ CI Passed
    runs-on: ubuntu-latest
    needs: [build-server, build-client]

    steps:
      - name: All checks passed
        run: echo "✅ Build thành công!"